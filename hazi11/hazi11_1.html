<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tippelős játék (1-10)</title>
    <link id="theme-link" rel="stylesheet" href="alert.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-card {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #1d3557;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
        }

        button {
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: #1d3557;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #457b9d;
        }

        button:disabled {
            background-color: #a8b2bd;
            cursor: not-allowed;
        }

        #feedback {
            min-height: 24px;
            font-weight: 500;
            color: #e63946;
            margin-bottom: 10px;
        }

        #restartBtn {
            display: none;
            width: 100%;
            background-color: #2a9d8f;
            margin-top: 10px;
        }

        #restartBtn:hover {
            background-color: #21867a;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Gondoltam egy számra (1–10)</h1>
        
        <div class="controls">
            <input type="number" id="guessInput" min="1" max="10" placeholder="1-10">
            <button id="guessBtn">Tipp!</button>
        </div>

        <p id="feedback"></p>
        <button id="restartBtn">Új játék</button>
    </div>

    <script type="module" src="hazi11_1.js" ></script>

</body>
</html>
