    <title>Házi 11</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;      
            justify-content: flex-start; 
            align-items: center;        
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1100px;
        }

        .link-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 180px;
            height: 130px;
            padding: 20px;
            background-color: #ffffff;
            color: #2b2d42;
            text-decoration: none;
            border-radius: 12px;
            border: 2px solid #e0e4e8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            text-align: center;
            
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .link-box h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #1d3557;
        }

        .link-box p {
            margin: 0;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .link-box:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            border-color: #457b9d;
        }
        .h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 40px;
            color: #1d3557;
        }
    </style>
</head>
